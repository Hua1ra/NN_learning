version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env.back
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.back
    depends_on:
      - db
volumes:
  pgdata: